<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- 
    THE CONCLAVE — OFFICIAL LOGO PLACEHOLDER
    Replace this file or update public/images/conclave-logo.png with the official logo provided by project owner.
  -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B26F"/>
